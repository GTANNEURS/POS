<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GDT Suite hors ligne</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #120c08; color: #fff; font-family: Arial, sans-serif; }
      main { width: min(520px, calc(100% - 32px)); border: 1px solid rgba(255,255,255,.14); border-radius: 28px; padding: 28px; background: linear-gradient(135deg, #1c130e, #3a240f); }
      p { color: #dbcab8; line-height: 1.6; }
      button { border: 0; border-radius: 999px; padding: 14px 22px; background: #ff8a1c; color: #120c08; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Mode hors ligne</h1>
      <p>L'application n'a pas pu charger cette page. Reviens sur une page deja ouverte, continue tes encaissements hors ligne, puis la synchronisation se lancera automatiquement au retour d'internet.</p>
      <button onclick="location.reload()">Reessayer</button>
    </main>
  </body>
</html>
